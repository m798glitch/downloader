name: youtube-downloader

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'YouTube URLs (one per line, or comma separated). Optional per‑URL: "v 720" or "a 192"'
        required: true
        type: string
      output_format:
        description: 'Default format (if no per‑URL type given)'
        required: false
        type: choice
        options:
          - mp4 (video)
          - mp3 (audio only)
        default: 'mp4 (video)'
      video_quality:
        description: 'Default video quality (if no per‑URL value given)'
        required: false
        type: choice
        options:
          - '2160p'
          - '1440p'
          - '1080p'
          - '720p'
          - '480p'
          - '360p'
        default: '720p'
      audio_quality:
        description: 'Default audio bitrate'
        required: false
        type: choice
        options:
          - '320kbps'
          - '192kbps'
          - '128kbps'
          - '64kbps'
        default: '192kbps'

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 700
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      # Parse URLs and per‑URL arguments
      - name: Parse URLs
        id: parse
        run: |
          INPUT="${{ github.event.inputs.url }}"
          MODIFIED=$(echo "$INPUT" | tr ',' '\n')
          ENTRIES='[]'
          while IFS= read -r line; do
            line=$(echo "$line" | xargs)
            [ -z "$line" ] && continue
            tokens=($line)
            i=0
            while [ $i -lt ${#tokens[@]} ]; do
              token="${tokens[$i]}"
              if [[ "$token" =~ ^https?:// ]]; then
                link="$token"
                args=()
                i=$((i+1))
                while [ $i -lt ${#tokens[@]} ]; do
                  next="${tokens[$i]}"
                  [[ "$next" =~ ^https?:// ]] && break
                  args+=("$next")
                  i=$((i+1))
                done
                args_json=$(printf '%s\n' "${args[@]}" | jq -R . | jq -s .)
                entry=$(jq -n --arg link "$link" --argjson args "$args_json" '{link: $link, args: $args}')
                ENTRIES=$(echo "$ENTRIES" | jq ". + [$entry]")
              else
                i=$((i+1))
              fi
            done
          done <<< "$MODIFIED"
          echo "ENTRIES_JSON=$(echo "$ENTRIES" | jq -c .)" >> $GITHUB_OUTPUT

      # Install tools (only curl, jq, ffmpeg, python3)
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl jq ffmpeg python3 python3-requests

      # Download using loader.to (primary and only method)
      - name: Download with loader.to
        run: |
          ENTRIES_JSON='${{ steps.parse.outputs.ENTRIES_JSON }}'
          OUTPUT_FOLDER="youtube"
          mkdir -p "$OUTPUT_FOLDER"

          GLOBAL_FORMAT="${{ github.event.inputs.output_format }}"
          GLOBAL_VQ="${{ github.event.inputs.video_quality }}"
          GLOBAL_AQ="${{ github.event.inputs.audio_quality }}"

          if [ "$GLOBAL_FORMAT" = "mp3 (audio only)" ]; then
            GLOBAL_TYPE="a"
            GLOBAL_VAL="$GLOBAL_AQ"
          else
            GLOBAL_TYPE="v"
            GLOBAL_VAL="$GLOBAL_VQ"
          fi

          count=$(echo "$ENTRIES_JSON" | jq length)
          for ((idx=0; idx<count; idx++)); do
            link=$(echo "$ENTRIES_JSON" | jq -r ".[$idx].link")
            args=$(echo "$ENTRIES_JSON" | jq -r ".[$idx].args[]" 2>/dev/null || true)
            type="$GLOBAL_TYPE"
            val="$GLOBAL_VAL"
            if [ -n "$args" ]; then
              first=$(echo "$args" | head -1)
              if [ "$first" = "v" ] || [ "$first" = "a" ]; then
                type="$first"
                val=$(echo "$args" | head -2 | tail -1)
              fi
            fi

            echo "Processing: $link ($type $val)"

            # Call loader.to via Python script
            python3 << EOF
import os, sys, time, json, requests, re

url = "$link"
is_audio = "$type" == "a"
quality = "$val"

# Normalise quality strings
if is_audio:
    if quality not in ('64kbps','128kbps','192kbps','320kbps'):
        quality = '192kbps'
else:
    if quality not in ('360p','480p','720p','1080p','1440p','2160p'):
        quality = '720p'

# Prepare payload for loader.to API
payload = {
    "url": url,
    "os": "linux",
    "output": {
        "type": "audio" if is_audio else "video",
        "format": "mp3" if is_audio else "mp4"
    }
}
if is_audio:
    payload["audio"] = {"bitrate": quality}
else:
    payload["output"]["quality"] = quality

headers = {
    "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36",
    "Accept": "application/json",
    "Origin": "https://loader.to",
    "Referer": "https://loader.to/"
}

s = requests.Session()
s.headers.update(headers)
s.get("https://loader.to/", timeout=15)

# Submit download request
resp = s.post("https://hub.ytconvert.org/api/download", json=payload, timeout=30)
resp.raise_for_status()
data = resp.json()
status_url = data.get('statusUrl')
title = data.get('title', 'video')

# Poll for completion
dl_url = None
for _ in range(120):  # up to 4 minutes
    time.sleep(2)
    try:
        r = s.get(status_url, timeout=20)
        status = r.json()
        if status.get('status') == 'completed':
            dl_url = status.get('downloadUrl')
            break
        if status.get('status') == 'failed':
            sys.exit(1)
    except:
        continue

if not dl_url:
    sys.exit(1)

# Build safe filename
vid_match = re.search(r'(?:v=|youtu\.be/)([a-zA-Z0-9_-]{11})', url)
vid = vid_match.group(1) if vid_match else "video"
safe_title = re.sub(r'[^a-zA-Z0-9_-]', '_', title)[:70]
filename = f"{safe_title}_{vid}_{quality}.{'mp3' if is_audio else 'mp4'}"

# Download the file
r = requests.get(dl_url, stream=True)
with open(f"{os.environ['OUTPUT_FOLDER']}/{filename}", 'wb') as f:
    for chunk in r.iter_content(chunk_size=8192):
        f.write(chunk)

print(f"Downloaded: {filename}")
EOF

            if [ $? -ne 0 ]; then
              echo "❌ loader.to failed for $link"
              exit 1
            fi
          done
        env:
          OUTPUT_FOLDER: youtube

      # Split files >99 MB into zip parts
      - name: Split large files
        run: |
          OUTPUT_FOLDER="youtube"
          THRESH_MB=99
          for f in "$OUTPUT_FOLDER"/*; do
            [ -f "$f" ] || continue
            size=$(stat -c%s "$f")
            if [ "$size" -gt $((THRESH_MB * 1024 * 1024)) ]; then
              echo "Splitting $f"
              zip -j -s "${THRESH_MB}m" "$OUTPUT_FOLDER/$(basename "$f").zip" "$f"
              rm "$f"
            fi
          done

      # Rename to safe characters
      - name: Rename files
        run: |
          OUTPUT_FOLDER="youtube"
          for f in "$OUTPUT_FOLDER"/*; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            newbase=$(echo "$base" | sed 's/[^a-zA-Z0-9._-]/_/g')
            if [ "$base" != "$newbase" ]; then
              mv "$f" "$OUTPUT_FOLDER/$newbase"
            fi
          done

      # Commit and push
      - name: Commit & Push
        run: |
          if [ -z "$(ls -A youtube 2>/dev/null)" ]; then
            echo "No files to commit"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add youtube/
          git commit -m "Download from loader.to [skip ci]"
          git pull --rebase --autostash origin "${{ github.ref_name }}"
          git push origin "${{ github.ref_name }}"